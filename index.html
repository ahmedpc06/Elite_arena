<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Arena ⚽ Football Contact Manager</title>
    <meta name="description" content="Football Contact Manager for Elite Arena Mumbai - Manage 570 football players">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo-section">
                <div class="logo-icon">⚽</div>
                <div class="logo-text">
                    <h1>Elite Arena</h1>
                    <p class="subtitle">Football Contact Manager</p>
                </div>
            </div>
            <div class="header-stats">
                <div class="stat-card">
                    <span class="stat-number" id="totalContacts">0</span>
                    <span class="stat-label">Total Players</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="calledCount">0</span>
                    <span class="stat-label">Called</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="confirmedCount">0</span>
                    <span class="stat-label">Confirmed</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="paidCount">0</span>
                    <span class="stat-label">Paid</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Toolbar -->
    <div class="toolbar">
        <div class="toolbar-left">
            <div class="search-box">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <input type="text" id="searchInput" placeholder="Search by name, number, or notes...">
            </div>
            <div class="filter-group">
                <select id="statusFilter">
                    <option value="all">All Status</option>
                    <option value="not_called">Not Called</option>
                    <option value="called">Called</option>
                    <option value="confirmed">Confirmed</option>
                    <option value="declined">Declined</option>
                    <option value="no_answer">No Answer</option>
                </select>
                <select id="paymentFilter">
                    <option value="all">All Payment</option>
                    <option value="paid">Paid ✅</option>
                    <option value="unpaid">Unpaid ❌</option>
                    <option value="partial">Partial 🔶</option>
                </select>
                <select id="roleFilter">
                    <option value="all">All Roles</option>
                    <option value="admin">Admin</option>
                    <option value="member">Member</option>
                </select>
            </div>
        </div>
        <div class="toolbar-right">
            <button class="btn btn-danger" id="deleteSelectedBtn" title="Delete Selected" style="padding:10px 18px;font-size:13px;">
                🗑️ Delete Selected
            </button>
            <button class="btn btn-secondary" id="addContactBtn" title="Add New Contact">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                Add Player
            </button>
            <button class="btn btn-primary" id="exportBtn" title="Export to Excel">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Export Excel
            </button>
            <button class="btn btn-accent" id="exportCSVBtn" title="Export to CSV">
                📋 CSV
            </button>
            <button class="btn btn-save" id="saveBtn" title="Save Changes">
                💾 Save
            </button>
        </div>
    </div>

    <!-- Table Container -->
    <div class="table-container">
        <table id="contactTable">
            <thead>
                <tr>
                    <th class="th-checkbox"><input type="checkbox" id="selectAll"></th>
                    <th class="th-sno sortable" data-sort="sno">#</th>
                    <th class="th-name sortable" data-sort="name">Name / Number</th>
                    <th class="th-phone">Phone</th>
                    <th class="th-whatsapp">WhatsApp</th>
                    <th class="th-role">Role</th>
                    <th class="th-status sortable" data-sort="status">Call Status</th>
                    <th class="th-payment sortable" data-sort="payment">Payment</th>
                    <th class="th-amount">Amount (₹)</th>
                    <th class="th-friends">Bringing Friends</th>
                    <th class="th-friend-count">Friend Count</th>
                    <th class="th-position">Position</th>
                    <th class="th-availability">Availability</th>
                    <th class="th-lastplayed sortable" data-sort="lastplayed">Last Played</th>
                    <th class="th-games">Total Games</th>
                    <th class="th-rating sortable" data-sort="rating">Rating</th>
                    <th class="th-notes">Notes</th>
                    <th class="th-actions">Actions</th>
                </tr>
            </thead>
            <tbody id="contactTableBody">
                <!-- Rows will be inserted here -->
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <div class="pagination">
        <div class="pagination-info">
            Showing <span id="showingStart">0</span>-<span id="showingEnd">0</span> of <span id="showingTotal">0</span> players
        </div>
        <div class="pagination-controls">
            <button class="page-btn" id="prevPage" disabled>← Previous</button>
            <div class="page-numbers" id="pageNumbers"></div>
            <button class="page-btn" id="nextPage">Next →</button>
        </div>
        <div class="per-page">
            <label>Per page:</label>
            <select id="perPage">
                <option value="25">25</option>
                <option value="50" selected>50</option>
                <option value="100">100</option>
                <option value="all">All</option>
            </select>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Player</h2>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" id="editName" placeholder="Player Name">
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="text" id="editPhone" placeholder="+91 XXXXX XXXXX">
                    </div>
                    <div class="form-group">
                        <label>Call Status</label>
                        <select id="editStatus">
                            <option value="not_called">Not Called</option>
                            <option value="called">Called</option>
                            <option value="confirmed">Confirmed</option>
                            <option value="declined">Declined</option>
                            <option value="no_answer">No Answer</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Payment Status</label>
                        <select id="editPayment">
                            <option value="unpaid">Unpaid</option>
                            <option value="paid">Paid</option>
                            <option value="partial">Partial</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Amount (₹)</label>
                        <input type="number" id="editAmount" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label>Bringing Friends?</label>
                        <select id="editFriends">
                            <option value="no">No</option>
                            <option value="yes">Yes</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Friend Count</label>
                        <input type="number" id="editFriendCount" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label>Position</label>
                        <select id="editPosition">
                            <option value="">Not Set</option>
                            <option value="GK">Goalkeeper (GK)</option>
                            <option value="DEF">Defender (DEF)</option>
                            <option value="MID">Midfielder (MID)</option>
                            <option value="FWD">Forward (FWD)</option>
                            <option value="ANY">Any Position</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Availability</label>
                        <select id="editAvailability">
                            <option value="">Not Set</option>
                            <option value="weekdays">Weekdays</option>
                            <option value="weekends">Weekends</option>
                            <option value="both">Both</option>
                            <option value="evenings">Evenings Only</option>
                            <option value="mornings">Mornings Only</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Rating (1-5)</label>
                        <input type="number" id="editRating" min="1" max="5" placeholder="1-5">
                    </div>
                    <div class="form-group full-width">
                        <label>Notes</label>
                        <textarea id="editNotes" placeholder="Any additional notes..."></textarea>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="modalCancel">Cancel</button>
                <button class="btn btn-primary" id="modalSave">Save Player</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <span id="toastMessage"></span>
    </div>

    <script src="contacts-data.js"></script>
    <script src="app.js"></script>
</body>
</html>
